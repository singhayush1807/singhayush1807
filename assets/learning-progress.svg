<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" fill="none">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <style>
      @keyframes fillBar { from { width: 0; } }
      .bar { animation: fillBar 1.5s ease-out forwards; }
    </style>
  </defs>
  
  <rect width="960" height="280" rx="24" fill="#E8F5E9"/>
  
  <text class="title" x="480" y="50" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" fill="#1B5E20" text-anchor="middle">// current_focus</text>
  
  <g transform="translate(180, 35)" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" fill="#1B5E20" font-weight="600">
    <text x="30" y="45">DSA &amp; Problem Solving</text>
    <rect x="30" y="55" width="500" height="12" rx="6" fill="#C8E6C9"/>
    <rect x="30" y="55" width="400" height="12" rx="6" fill="url(#barGrad)" class="bar"/>
    <text x="540" y="66" font-size="12">80%</text>

    <text x="30" y="95">Low Level Design (LLD)</text>
    <rect x="30" y="105" width="500" height="12" rx="6" fill="#C8E6C9"/>
    <rect x="30" y="105" width="350" height="12" rx="6" fill="url(#barGrad)" class="bar" style="animation-delay: 0.2s"/>
    <text x="540" y="116" font-size="12">70%</text>

    <text x="30" y="145">HLD &amp; System Design</text>
    <rect x="30" y="155" width="500" height="12" rx="6" fill="#C8E6C9"/>
    <rect x="30" y="155" width="300" height="12" rx="6" fill="url(#barGrad)" class="bar" style="animation-delay: 0.4s"/>
    <text x="540" y="166" font-size="12">60%</text>

    <text x="30" y="195">Software Development &amp; Projects</text>
    <rect x="30" y="205" width="500" height="12" rx="6" fill="#C8E6C9"/>
    <rect x="30" y="205" width="250" height="12" rx="6" fill="url(#barGrad)" class="bar" style="animation-delay: 0.6s"/>
    <text x="540" y="216" font-size="12">50%</text>
  </g>
</svg>

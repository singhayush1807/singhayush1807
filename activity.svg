<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" fill="none">
  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="900" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050805"/>
      <stop offset="100%" stop-color="#0B170E"/>
    </linearGradient>
    <style>
      @keyframes scan{0%{x:0}100%{x:850}}
      .scanbar{animation:scan 4s linear infinite}
    </style>
  </defs>
  <rect width="900" height="80" fill="url(#aBg)" rx="12"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#1B5E20" stroke-width="1"/>
  <!-- Title -->
  <text x="40" y="32" font-family="monospace" font-size="13" font-weight="700" fill="#66BB6A">// recent_activity</text>
  <line x1="40" y1="42" x2="860" y2="42" stroke="#1B5E20" stroke-width="1"/>
  <!-- Activity bar visualisation -->
  <g transform="translate(40,52)">
    <rect width="820" height="16" rx="4" fill="#1B5E20" opacity=".15"/>
    <!-- Green bars representing activity -->
    <rect x="0" width="40" height="16" rx="4" fill="#66BB6A" opacity=".2"/>
    <rect x="50" width="25" height="16" rx="4" fill="#66BB6A" opacity=".35"/>
    <rect x="85" width="60" height="16" rx="4" fill="#66BB6A" opacity=".25"/>
    <rect x="155" width="30" height="16" rx="4" fill="#66BB6A" opacity=".4"/>
    <rect x="195" width="45" height="16" rx="4" fill="#66BB6A" opacity=".3"/>
    <rect x="250" width="20" height="16" rx="4" fill="#66BB6A" opacity=".5"/>
    <rect x="280" width="55" height="16" rx="4" fill="#66BB6A" opacity=".2"/>
    <rect x="345" width="35" height="16" rx="4" fill="#66BB6A" opacity=".45"/>
    <rect x="390" width="40" height="16" rx="4" fill="#66BB6A" opacity=".3"/>
    <rect x="440" width="25" height="16" rx="4" fill="#66BB6A" opacity=".6"/>
    <rect x="475" width="50" height="16" rx="4" fill="#66BB6A" opacity=".25"/>
    <rect x="535" width="30" height="16" rx="4" fill="#66BB6A" opacity=".4"/>
    <rect x="575" width="45" height="16" rx="4" fill="#66BB6A" opacity=".35"/>
    <rect x="630" width="20" height="16" rx="4" fill="#66BB6A" opacity=".5"/>
    <rect x="660" width="55" height="16" rx="4" fill="#66BB6A" opacity=".2"/>
    <rect x="725" width="35" height="16" rx="4" fill="#66BB6A" opacity=".55"/>
    <rect x="770" width="50" height="16" rx="4" fill="#66BB6A" opacity=".3"/>
    <!-- Scan line -->
    <rect width="4" height="16" rx="2" fill="#E8F5E9" opacity=".15" class="scanbar"/>
  </g>
</svg>

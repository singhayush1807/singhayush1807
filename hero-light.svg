<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F8E9"/><stop offset="50%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <pattern id="d" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r=".6" fill="#2E7D32" opacity=".04"/></pattern>
    <clipPath id="c"><rect x="650" y="30" width="280" height="340" rx="24"/></clipPath>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B5E20" flood-opacity=".06"/></filter>
    <style>
      @keyframes b{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .cr{animation:b 1.1s step-end infinite}
      .pl{animation:p 2.5s ease-in-out infinite}
      .ft{animation:f 4s ease-in-out infinite}
    </style>
  </defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <rect width="960" height="400" fill="url(#d)"/>
  <circle cx="80" cy="60" r="30" fill="#66BB6A" opacity=".03" class="ft"/>
  <circle cx="920" cy="80" r="20" fill="#81C784" opacity=".04" class="ft" style="animation-delay:1.5s"/>
  <rect width="960" height="3" fill="#2E7D32" opacity=".2"/>
  <g opacity=".15"><line x1="32" y1="45" x2="32" y2="355" stroke="#2E7D32" stroke-width="2"/><line x1="32" y1="45" x2="48" y2="45" stroke="#2E7D32" stroke-width="2"/><line x1="32" y1="355" x2="48" y2="355" stroke="#2E7D32" stroke-width="2"/></g>
  <line x1="76" y1="65" x2="76" y2="375" stroke="#2E7D32" stroke-width=".6" opacity=".06"/>
  <text x="90" y="82" font-family="monospace" font-size="13" fill="#2E7D32" opacity=".4">// hello, world — welcome to my profile</text>
  <text x="90" y="130" font-family="sans-serif" font-size="48" font-weight="900" fill="#1B5E20">Ayush Kumar</text>
  <rect x="90" y="148" width="280" height="32" rx="16" fill="#66BB6A" opacity=".15"/>
  <text x="108" y="169" font-family="monospace" font-size="12" font-weight="700" fill="#1B5E20">💻 CSE Student · Full Stack Developer</text>
  <text x="90" y="210" font-family="monospace" font-size="12" fill="#2E7D32" opacity=".7">📍 Vaishali, Bihar · PCE Jaipur</text>
  <text x="90" y="242" font-family="sans-serif" font-size="14" fill="#1B5E20" opacity=".8">Building tournament platforms, blogs, and tools with</text>
  <text x="90" y="264" font-family="sans-serif" font-size="14" fill="#1B5E20" opacity=".8">the MERN stack, C++, and Python.</text>
  <circle cx="98" cy="298" r="3.5" fill="#2E7D32" class="pl"/>
  <text x="112" y="302" font-family="monospace" font-size="12" fill="#1B5E20" opacity=".7">Open to opportunities &amp; collaboration</text>
  <rect x="90" y="322" width="480" height="32" rx="8" fill="#1B5E20" opacity=".04"/>
  <text x="102" y="343" font-family="monospace" font-size="12" fill="#2E7D32" opacity=".5">singhayush1807:~$</text>
  <text x="254" y="343" font-family="monospace" font-size="12" fill="#1B5E20" opacity=".8">cat README.md</text>
  <rect x="380" y="331" width="9" height="16" rx="1" fill="#2E7D32" class="cr"/>
  <rect x="644" y="24" width="292" height="352" rx="28" fill="#66BB6A" opacity=".04"/>
  <rect x="650" y="30" width="280" height="340" rx="24" fill="#fff" opacity=".3" filter="url(#s)"/>
  <image href="./character.png" x="655" y="35" width="270" height="330" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="650" y="30" width="280" height="340" rx="24" fill="none" stroke="#2E7D32" stroke-width=".4" stroke-opacity=".1"/>
  <rect y="397" width="960" height="3" fill="#66BB6A" opacity=".15"/>
</svg>
